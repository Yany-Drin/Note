name: Web Build + Deploy to GitHub Pages
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: "pages"
  cancel-in-progress: false
env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1
  FLET_PYTHON_BUILD_MANIFEST: ${{ github.workspace }}/python-manifest.json
jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Build app
        shell: bash
        run: |
          uv run flet build web \
          --yes \
          --no-cdn \
          --pwa-short-name "字音標註" \
          --pwa-theme-color "#C2185B" \
          --pwa-background-color "#FFF5F6" \
          --base-url ${GITHUB_REPOSITORY#*/} \
          --route-url-strategy hash
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: build/web
          name: web-build-artifact
          retention-days: 20
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: web-build-artifact
